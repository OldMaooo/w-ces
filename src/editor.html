</style></head><body><header><strong>CES / 展台草图</strong><small>v0.1.19 · 米</small><div class="actions"><button id="undo" title="⌘/Ctrl Z">撤销</button><button id="redo" title="⌘/Ctrl Shift Z 或 Ctrl Y">重做</button><button id="routeBtn" title="游客路线：在平面图纸上标兴趣点、排参观顺序"></button><button id="import">导入方案</button><select id="exportScope" aria-label="导出范围"><option value="current">当前方案</option><option value="all">全部方案</option></select><button class="primary" id="save" title="修改会自动保存到本机；导出用于备份或换设备">导出 JSON</button><button id="saveEditor">下载编辑器</button><input id="importFile" type="file" accept=".html,.json" hidden></div></header><div id="planbar"><div id="tabs" role="tablist" aria-label="方案"></div><button id="newPlan">另存方案 +</button><button id="rename">改名</button><span id="saveStatus" role="status"></span></div><main><aside><section id="layers"><h2>图层管理</h2><div class="objects" id="objects"></div><div id="layerResize" role="separator" aria-label="调整图层栏高度" aria-orientation="horizontal" tabindex="0" title="上下拖动调整高度"></div></section><div id="inspectorScroll"><section><h2>选中物料</h2><div id="empty">点击场景或上方列表选择物料</div><div id="creatorPanel" hidden><div id="creatorTitle" style="font-size:14px;font-weight:500;margin-bottom:8px">Creator Space</div><div class="line"><button id="flipCreator" title="讲台、演讲台与座椅整体前后掉头">前后翻转</button></div></div><div id="inspector" hidden><div id="title"></div><div class="fields"><label>左右 X<input id="x" type="number" step="0.1"></label><label>离地高度<input id="y" type="number" min="0" step="0.1"></label><label>前后 Z<input id="z" type="number" step="0.1"></label></div><div id="screenFields" hidden><div class="fields" style="grid-template-columns:1fr"><label>屏幕用途名称<input id="purpose" type="text" maxlength="40" placeholder="例如：产品演示"></label></div><div class="sub">屏幕尺寸（英寸 · 16:9）</div><div class="presets"><button data-inches="48">48 寸</button><button data-inches="55">55 寸</button><button data-inches="65">65 寸</button></div><div class="fields two"><label>自定义英寸<input id="inches" type="number" min="10" max="120" step="1"></label><label id="orientationLabel">屏幕方向<select id="orientation"><option value="landscape">横屏</option><option value="portrait">竖屏</option></select></label></div></div><div id="fasciaFields" hidden><div class="fields two"><label>吊楣形状<select id="fasciaShape"><option value="square">方形</option><option value="round">圆形</option></select></label><label id="fasciaSpanLabel">边长（米）<input id="fasciaSpan" type="number" min="0.15" max="10" step="0.1"></label></div><p class="note">离地高度控制底边悬空高度；整体尺寸的「高」控制吊楣自身高度。</p></div><div id="standFields" hidden><div class="fields" style="grid-template-columns:1fr"><label>纸张尺寸<select id="paper"><option value="A4">A4 · 210 × 297 毫米</option><option value="A5">A5 · 148.5 × 210 毫米</option></select></label></div></div><div id="lFields" hidden><div class="sub">L 台两条边（米）</div><div class="fields two"><label>横边长度<input id="lengthA" type="number" min="0.2" max="10" step="0.1"></label><label>横边宽度<input id="widthA" type="number" min="0.1" max="5" step="0.1"></label><label>纵边长度<input id="lengthB" type="number" min="0.2" max="10" step="0.1"></label><label>纵边宽度<input id="widthB" type="number" min="0.1" max="5" step="0.1"></label></div></div><div id="personFields" hidden><div class="fields two"><label>等比缩放<input id="personScale" type="number" min="0.25" max="3" step="0.05"></label><label>马甲颜色<input id="clothesColor" type="color" value="#165DFF"></label></div><div class="fields" style="grid-template-columns:1fr"><label>动画<select id="personAnimation"></select></label></div></div><div class="sub">整体尺寸（米）</div><div class="fields"><label>宽<input id="w" type="number" min="0.1" max="10" step="0.1"></label><label>高<input id="h" type="number" min="0.1" max="10" step="0.1"></label><label>深<input id="d" type="number" min="0.1" max="10" step="0.1"></label></div><div class="sub">朝向 · 每次 45°</div><div class="fields"><button id="rotateLeft">−45°</button><label><input id="rotation" aria-label="朝向" type="number" step="45"></label><button id="rotate">+45°</button></div><label class="check"><input id="wallSnap" type="checkbox">靠墙吸附</label><p class="note" id="snapNote" hidden>已贴墙；旋转会解除吸附。</p><details><summary>微移 · 每次 0.1 米</summary><div class="nudges"><button data-axis="x" data-delta="-0.1">左 −X</button><button data-axis="y" data-delta="0.1">上 +Y</button><button data-axis="z" data-delta="-0.1">后 −Z</button><button data-axis="x" data-delta="0.1">右 +X</button><button data-axis="y" data-delta="-0.1">下 −Y</button><button data-axis="z" data-delta="0.1">前 +Z</button></div></details><div class="line"><button id="place" title="选中物品后，点击另一物品的水平表面放置">放置</button><button id="ground">落地</button><button id="copy">复制</button><button id="delete" title="Delete / Backspace">删除</button></div><div id="status"></div></div></section><section id="roomPanel"><h2>场地</h2><div id="roomSize"></div><div class="line"><button id="swapWalls">A / B 墙长互换</button></div><div class="line"><label class="check"><input id="wallA" type="checkbox" checked><span id="wallAText"></span></label><label class="check"><input id="wallB" type="checkbox" checked><span id="wallBText"></span></label></div><label class="check"><input id="snap" type="checkbox" checked>移动按 0.1 米对齐</label><p class="note">换墙时地面物料转 90°，间距自动适配。<br>方案自动存本机，导出 JSON 可带走。</p></section></div></aside><div id="resize"></div><div id="view"><div id="viewbar"><button data-view="venue" title="北向上 · 未标注展区按图估算">会场全景</button><button data-view="perspective" class="active">透视</button><button data-view="top">俯视</button><button data-view="front">正视</button><button id="decalMode" title="进入后点亮着的面添加设计图 · Esc 退出">贴图</button><button id="walk">步行浏览</button></div><button id="libraryToggle" aria-expanded="false" aria-controls="library"><span id="libraryIcon"></span>物料</button><section id="library" aria-label="物料库" hidden><div class="library-head"><strong>物料库</strong><button id="libraryClose" class="icon-button" aria-label="关闭物料库" title="关闭物料库"></button></div><p class="library-help">拖入画布添加 · 也可点击添加</p><div class="add"><button data-add="tv">电视 +</button><button data-add="desk">前台 +</button><button data-add="robot">机器人 +</button><button data-add="display">闺蜜机 +</button><button data-add="table">小圆桌 +</button><button data-add="ldesk">L 型台 +</button><button data-add="fascia">悬空吊楣 +</button><button data-add="laptop" title="笔记本电脑">笔记本 +</button><button data-add="webcam" title="电脑摄像头（输入设备）">摄像头 +</button><button data-add="acrylicA4" title="亚克力立牌 · 选中后在左侧切换 A4 / A5">亚克力立牌 +</button><button data-add="rollup" title="80 × 200 厘米画面，含底座总高 2.08 米">易拉宝 +</button><button data-add="chair" title="简易听讲椅 · 46 × 82 × 50 厘米">听讲椅 +</button><button data-add="staff" disabled>工作人员 +</button><button data-add="visitor" disabled>游客 +</button></div><div id="peopleStatus" role="status"></div></section><div id="placementHint" role="status" hidden style="position:absolute;top:54px;left:14px;z-index:3;background:#fffef3;border:1px solid #b8cabb;border-radius:5px;padding:8px 12px;pointer-events:none"></div><div class="badge"><b id="badgeSize"></b><small>周边按图估算 · 非施工图</small></div><div class="help"><span id="helpText">拖空白转视角 · 滚轮缩放 · WASD 行走 · 空格切换浏览</span></div></div><div id="routeEdit" hidden></div></main><script id="seed" type="application/json">null</script>
